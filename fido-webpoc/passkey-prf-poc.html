<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FIDO2 PRF library demo</title>
  <style>
    body { max-width: 42rem; margin: 3rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; }
    button { margin: 0 .4rem .6rem 0; padding: .6rem .9rem; }
    pre { padding: 1rem; border: 1px solid #aaa; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>FIDO2 WebAuthn PRF demo</h1>
  <button id="enroll">Enroll passkey or security key</button>
  <button id="clear">Clear local credential</button>
  <button id="derive">Derive AES key</button>
  <pre id="output"></pre>

  <script type="module">
    import { YubiKeyPrf } from "./passkey-prf.js";

    const yubikey = new YubiKeyPrf({
      storageKey: "demo-yubikey-credential-id",
      rpName: "FIDO2 PRF Demo",
      prfInput: "example.com/demo/cipher-key/v1",
      hkdfInfo: "example.com/demo/aes-gcm/v1"
    });
    const output = document.querySelector("#output");
    const run = async action => {
      try { output.textContent = await action(); }
      catch (error) { output.textContent = `${error.name}: ${error.message}`; }
    };

    document.querySelector("#enroll").onclick = () => run(async () => {
      const result = await yubikey.enroll({ userName: "demo-user" });
      return `Enrolled.\nCredential ID: ${result.credentialId}`;
    });

    document.querySelector("#clear").onclick = () => run(async () => {
      yubikey.clearCredential();
      return "Local credential ID cleared. WebAuthn cannot delete the credential from the YubiKey.";
    });

    document.querySelector("#derive").onclick = () => run(async () => {
      const key = await yubikey.deriveAesKey({ extractable: true });
      const keyBytes = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      const keyHex = [...keyBytes].map(byte => byte.toString(16).padStart(2, "0")).join("");
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const plaintext = new TextEncoder().encode("AES key works");
      const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, plaintext);
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
      return `Derived key: ${keyHex}\n${key.algorithm.name}-${key.algorithm.length}; extractable=${key.extractable}\nRound trip: ${new TextDecoder().decode(decrypted)}`;
    });

    output.textContent = yubikey.enrolled ? "A local credential ID is enrolled." : "No local credential ID is enrolled.";
  </script>
  <p>tested on yubikey and iphone passkey</p>
</body>
</html>
